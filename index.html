<title>Pregnancy Food Check</title>
<style>
  :root {

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 18px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 20px 120px;
  }
  h1 {
    font-size: 30px;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
    font-weight: 700;
  }
  .lede {
    color: var(--muted);
    margin: 0 0 22px;
    font-size: 16px;
  }
  .search {
    width: 100%;
    padding: 16px 18px;
    font-size: 20px;
    border: 2px solid var(--border);
    border-radius: 14px;
    background: var(--card);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
  }
  .search:focus { border-color: var(--accent); }
  .results {
    margin-top: 22px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .food {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
  }
  .badge {
    display: inline-block;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .badge.safe { background: var(--safe-bg); color: var(--safe-fg); }
  .badge.caution { background: var(--caution-bg); color: var(--caution-fg); }
  .badge.avoid { background: var(--avoid-bg); color: var(--avoid-fg); }
  .reason { margin: 10px 0 0; color: var(--text); font-size: 16px; }
  .source { margin-top: 10px; font-size: 14px; }
  .source a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid rgba(58, 90, 124, 0.35);
  }
  .source a:hover { border-bottom-color: var(--accent); }
  .empty {
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: 14px;
    padding: 22px 18px;
    color: var(--muted);
    text-align: center;
    font-size: 16px;
  }
  .disclaimer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--disclaimer-bg);
    border-top: 1px solid var(--disclaimer-border);
    color: var(--disclaimer-fg);
    font-size: 14px;
    padding: 12px 16px;
    text-align: center;
    z-index: 10;
  }
  @media (max-width: 480px) {
    h1 { font-size: 24px; }
    .search { font-size: 18px; padding: 14px 16px; }
    .food { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Pregnancy Food Check</h1>
  <p class="lede">Search a food to see if it's generally safe, needs caution, or should be avoided.</p>
  <input id="q" class="search" type="search" placeholder="Search a food…" autocomplete="off" autofocus aria-label="Search a food">
  <div id="results" class="results" aria-live="polite"></div>
</div>
<div class="disclaimer" id="disclaimer">
  General food-safety guidance from public health agencies. Not medical advice. Ask your doctor or midwife.
</div>

<script>
  (function () {
    const data = JSON.parse(document.getElementById('food-data').textContent);
    const resultsEl = document.getElementById('results');
    const qEl = document.getElementById('q');

    const CATEGORY_LABEL = { safe: 'Safe', caution: 'Caution', avoid: 'Avoid' };

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function render(query) {
      const q = query.trim().toLowerCase();
      resultsEl.innerHTML = '';
      if (!q) return;

      const hits = data.filter(function (row) {
        return row.food.toLowerCase().includes(q);
      });

      if (hits.length === 0) {
        const div = document.createElement('div');
        div.className = 'empty';
        div.id = 'no-results';
        div.textContent = "Sorry, that food isn't in our list. We don't guess. Ask your doctor or midwife.";
        resultsEl.appendChild(div);
        return;
      }

      const rank = { avoid: 0, caution: 1, safe: 2 };
      hits.sort(function (a, b) {
        return (rank[a.category] - rank[b.category]) || a.food.localeCompare(b.food);
      });

      for (const row of hits) {
        const card = document.createElement('article');
        card.className = 'card';
        card.dataset.category = row.category;
        card.innerHTML =
          '<div class="row">' +
            '<p class="food">' + escapeHtml(row.food) + '</p>' +
            '<span class="badge ' + row.category + '" data-category="' + row.category + '">' + CATEGORY_LABEL[row.category] + '</span>' +
          '</div>' +
          '<p class="reason">' + escapeHtml(row.reason) + '</p>' +
          '<p class="source"><a href="' + encodeURI(row.source) + '" target="_blank" rel="noopener noreferrer">Source</a></p>';
        resultsEl.appendChild(card);
      }
    }

    qEl.addEventListener('input', function (e) { render(e.target.value); });
  })();
</script>
